[project]
name = "paisa-vasool-backend"
version = "0.1.0"
description = "Backend service for Paisa Vasool"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.133.1",
    "uvicorn[standard]>=0.41.0",
    "httpx>=0.27.2",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "sqlalchemy>=2.0.47",
    "asyncpg",
    "psycopg>=3.3.3",
    "passlib[argon2-cffi]>=1.7.4",
    "python-jose>=3.5.0",
    "redis>=7.2.1",
    "rq",
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.22",
    "pandas>=3.0.1",
    "openpyxl>=3.1.5",
    "langchain>=1.2.10",
    "langchain-core>=1.2.16",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.1",
    "langchain-groq>=1.1.2",
    "langgraph>=1.0.10",
    "pymupdf4llm>=0.3.4",
    "aiosmtplib>=5.1.0",
    "fastapi_mail",
    "uuid7>=0.1.0",
    "python-json-logger>=4.0.0",
    "apscheduler>=3.11.2",
    "google-cloud-storage",
    "alembic>=1.18.4",
    "mypy>=1.19.1",
    "types-redis>=4.6.0.20241004",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S105", "S106", "E501", "UP038"]

[tool.ruff.lint.per-file-ignores]
"src/api/rest/routes/*" = ["B008"]

[tool.mypy]

python_version = "3.12"
plugins = ["pydantic.mypy"]


ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
strict_optional = true

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.7",
]
